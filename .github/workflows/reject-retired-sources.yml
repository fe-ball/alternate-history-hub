name: Reject retired Keisanki sources

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-sources:
    runs-on: ubuntu-latest
    steps:
      # Only materialize the checker; git ls-tree still inspects the entire commit.
      # Imported archive filenames can exceed the runner filesystem's name limit.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /scripts/check_retired_sources.py
            /retired-keisanki-sources.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject restored or renamed obsolete files
        run: python scripts/check_retired_sources.py
